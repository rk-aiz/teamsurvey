# テスト用DB設定 (H2 Database)
# PostgreSQL互換モード(MODE=PostgreSQL)を有効にして、本番用のschema.sql(ENUMやSERIAL等)を解釈できるようにする
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# MyBatisの実行SQLをログ出力する (Mapperのパッケージを指定)
logging.level.com.github.rk_aiz.teamsurvey.infrastructure.mapper=DEBUG

spring.sql.init.mode=never