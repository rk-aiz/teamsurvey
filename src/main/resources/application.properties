spring.application.name=teamsurvey

#ポート設定
server.port=9000
server.forward-headers-strategy: framework

# Postgresのドライバー設定
spring.datasource.driver-class-name=org.postgresql.Driver
# データベースへの接続URLを設定
# stringtype=unspecified を付けると、JavaのString型をPostgreSQLのENUM型にスムーズに変換できます
spring.datasource.url=jdbc:postgresql://localhost:5432/teamsurveydb?stringtype=unspecified

# データベース接続の為のユーザー名
spring.datasource.username=teamsurveyuser
# データベース接続の為のパスワード
spring.datasource.password=teamsurveypass
# SQLスクリプトの初期化モードを設定
spring.sql.init.mode=always
# Log表示設定
logging.level.com.example.webapp.repository=DEBUG

# DBのカラム名(スネークケース)とJavaのフィールド名(キャメルケース)を自動変換する設定
mybatis.configuration.map-underscore-to-camel-case=true

# アプリ名
app.name=TeamSurvey
# アンケート締め切りのデフォルト日数（作成日から何日後か）
app.survey.default-deadline-days=30

