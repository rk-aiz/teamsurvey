spring.application.name=teamsurvey

#ポート設定
server.port=13500
#リバースプロキシ対応を有効化
server.forward-headers-strategy=native

# アプリ名
app.name=TeamSurvey
# プロキシのプレフィックス (code-server環境用)
#app.proxy.prefix=/proxy/8081
# アンケート締め切りのデフォルト日数(作成日から何日後か)
app.survey.default-deadline-days=30

# Postgresのドライバー設定
spring.datasource.driver-class-name=org.postgresql.Driver
# データベースへの接続URLを設定
# stringtype=unspecified を付けると、JavaのString型をPostgreSQLのENUM型にスムーズに変換できます
spring.datasource.url=jdbc:postgresql://localhost:5432/teamsurveydb?stringtype=unspecified

# データベース接続の為のユーザー名
spring.datasource.username=teamsurveyuser
# データベース接続の為のパスワード
spring.datasource.password=teamsurveypass
# SQLスクリプトの初期化モードを設定
# 安全のためデフォルトはneverにし、初期化が必要な時だけ明示的に有効化するか、DBコンテナ側に任せます
spring.sql.init.mode=never
# Log表示設定
logging.level.com.example.webapp.repository=DEBUG

# DBのカラム名(スネークケース)とJavaのフィールド名(キャメルケース)を自動変換する設定
mybatis.configuration.map-underscore-to-camel-case=true

# TomcatのPOSTデータサイズ制限を緩和 (デフォルト2MB -> 10MB)
server.tomcat.max-http-form-post-size=10MB

# マルチパートリクエストのサイズ制限も合わせて緩和
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
