<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xml:lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>400 Bad Request</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/bootstrap-icons.css}" rel="stylesheet">
</head>

<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm border-0">
                    <div class="card-body text-center p-5">
                        <div class="text-warning mb-4">
                            <i class="bi bi-exclamation-circle-fill" style="font-size: 4rem;"></i>
                        </div>
                        <h1 class="h3 mb-3 fw-normal">不正なリクエスト</h1>
                        <p class="text-muted mb-4">
                            リクエストの形式が正しくありません。<br>入力内容を確認してください。
                        </p>
                        <div class="d-grid gap-2">
                            <a th:href="@{/}" class="btn btn-primary">トップページへ戻る</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
