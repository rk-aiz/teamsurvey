<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xml:lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>500 Internal Server Error</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/bootstrap-icons.css}" rel="stylesheet">
</head>

<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm border-0">
                    <div class="card-body text-center p-5">
                        <div class="text-danger mb-4">
                            <i class="bi bi-cone-striped" style="font-size: 4rem;"></i>
                        </div>
                        <h1 class="h3 mb-3 fw-normal">システムエラー</h1>
                        <p class="text-muted mb-4">
                            サーバー内部で予期せぬエラーが発生しました。<br>しばらく経ってから再度お試しください。
                        </p>

                        <div class="d-grid gap-2">
                            <!--/* 通常はメニューへ戻るリンクを表示 */-->
                            <a th:if="${path != '/'}" th:href="@{/}" class="btn btn-primary">トップページへ戻る</a>

                            <!--/* トップページ(/)でのエラー時は、メニューに戻ってもエラーになるためログアウトボタンを表示 */-->
                            <form th:if="${path == '/'}" th:action="@{/logout}" method="post" class="d-grid">
                                <button type="submit" class="btn btn-outline-danger">ログアウトして再ログイン</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
