<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="utf-8">
<style>body{font-family:Arial,Helvetica,sans-serif;font-size:12px;text-align:center}h1{color:#06C;font-size:25px;line-height:60px;margin-top:56px}img{margin-top:40px}
</style>
</head>
<body>
<h1 id="a">500 - Internal Server Error</h1>
<h2>Webサイトはこのページを表示できません</h1>
<hr>
<p>このページはメンテナンス中であるか、内部エラーが発生している可能性があります</p>
<p><a th:href="@{/}">メニュー画面へ</a></p>

<!-- 管理者のみエラー詳細を表示 -->
<div sec:authorize="hasRole('ADMIN')" style="margin: 30px auto; width: 80%; text-align: left; border: 1px solid #ccc; padding: 20px; background-color: #f8f9fa;">
    <h3 style="color: #dc3545; margin-top: 0; border-bottom: 1px solid #ccc; padding-bottom: 10px;">Error Details (Admin Only)</h3>
    <p><strong>Status:</strong> <span th:text="${status}"></span></p>
    <p><strong>Error:</strong> <span th:text="${error}"></span></p>
    <p><strong>Message:</strong> <span th:text="${message}"></span></p>
    <p><strong>Path:</strong> <span th:text="${path}"></span></p>
    <div th:if="${trace}" style="margin-top: 15px;">
        <strong>Stack Trace:</strong>
        <pre th:text="${trace}" style="background-color: #fff; border: 1px solid #ddd; padding: 10px; overflow: auto; max-height: 300px; font-size: 11px; font-family: monospace;"></pre>
    </div>
</div>
</body>
</html>
