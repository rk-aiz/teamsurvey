<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xml:lang="ja"
    layout:decorate="~{public_layout}">

<head>
    <meta charset="UTF-8">
    <title>トップ</title>
</head>

<body>
    <!-- ヘッダーのボタンを非表示にする -->
    <div layout:fragment="header-buttons"></div>

    <!-- メインコンテンツ -->
    <main layout:fragment="content" class="container py-5">
        <div class="row justify-content-center align-items-center" style="min-height: 70vh;">
            <div class="col-md-6 col-lg-4">
                <div class="text-center mb-4">
                    <h1 class="h3 mt-2 fw-bold" th:text="${appName}">TeamSurvey</h1>
                </div>

                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <p class="text-muted text-center small mb-4">Please login</p>

                        <!-- エラーメッセージ -->
                        <div th:if="${errorMessage}" class="alert alert-danger py-2 small" role="alert"
                            th:text="${errorMessage}">
                            エラーメッセージ
                        </div>
                        <div th:if="${param.error}" class="alert alert-danger py-2 small" role="alert">
                            ユーザー名またはパスワードが正しくありません。
                        </div>

                        <form th:action="@{/authentication}" method="post">
                            <div class="mb-3">
                                <label for="username" class="form-label small text-muted fw-bold"><i
                                        class="bi bi-person me-1"></i>Username</label>
                                <input type="text" name="username" id="username" class="form-control"
                                    placeholder="Username" th:field="*{usernameInput}" required autofocus>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label small text-muted fw-bold"><i
                                        class="bi bi-lock me-1"></i>Password</label>
                                <input type="password" name="password" id="password" class="form-control"
                                    placeholder="Password" th:field="*{passwordInput}" required>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Login</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        </div>
    </main>
</body>

</html>
