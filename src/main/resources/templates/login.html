<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xml:lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>[[${appName}]]</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">

    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/bootstrap-icons.css}" rel="stylesheet">
    <!--/* Google Fonts: Nunito */-->
    <link th:href="@{/css/nunito.css}" rel="stylesheet">
    <script>
        // テーマ初期化
        const getPreferredTheme = () => {
            const storedTheme = localStorage.getItem('theme');
            if (storedTheme) return storedTheme;
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-bs-theme', getPreferredTheme());
    </script>
</head>

<body>

    <!--/* メインコンテンツ */-->
    <main layout:fragment="content" class="container py-5">
        <div class="row justify-content-center align-items-center" style="min-height: 70vh;">
            <div class="col-md-6 col-lg-4">
                <div class="text-center mb-4">
                    <h1 class="h3 mt-2 fw-bold" style="font-family: 'Nunito', sans-serif; color: #8a8c99;"
                        th:text="${appName}">TeamSurvey</h1>
                </div>

                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <!--/* デモモード用表示 */-->
                        <div th:if="${@environment.getProperty('app.demo-mode.enabled') == 'true'}" class="mb-4">
                            <div class="alert alert-info small">
                                <h6 class="alert-heading fw-bold"><i class="bi bi-info-circle-fill me-1"></i>デモモード</h6>
                                <p class="mb-2">
                                    ポートフォリオとして公開しています。<br>
                                    以下のボタンでゲストとしてログインできます。
                                </p>
                                <form th:action="@{/authentication}" method="post">
                                    <input type="hidden" name="usernameInput"
                                        th:value="${@environment.getProperty('app.demo-mode.guest-username')}">
                                    <input type="hidden" name="passwordInput"
                                        th:value="${@environment.getProperty('app.demo-mode.guest-password')}">
                                    <button type="submit" class="btn btn-info btn-sm w-100 text-white fw-bold">
                                        <i class="bi bi-box-arrow-in-right me-1"></i> ゲストログイン
                                    </button>
                                </form>
                            </div>
                            <hr>
                        </div>

                        <p class="text-muted text-center small mb-4">Please login</p>

                        <!--/* エラーメッセージ */-->
                        <div th:if="${errorMessage}" class="alert alert-danger py-2 small" role="alert"
                            th:text="${errorMessage}">
                            エラーメッセージ
                        </div>
                        <div th:if="${param.error}" class="alert alert-danger py-2 small" role="alert">
                            ユーザー名またはパスワードが正しくありません。
                        </div>
                        <div th:if="${param.timeout}" class="alert alert-warning py-2 small" role="alert">
                            セッションの有効期限が切れました。もう一度ログインしてください。
                        </div>

                        <form th:action="@{/authentication}" method="post" th:object="${loginForm}">
                            <div class="mb-3">
                                <label for="username" class="form-label small text-muted fw-bold"><i
                                        class="bi bi-person me-1"></i>Username</label>
                                <input type="text" name="username" id="username" class="form-control"
                                    placeholder="Username" th:field="*{usernameInput}" required autofocus>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label small text-muted fw-bold"><i
                                        class="bi bi-lock me-1"></i>Password</label>
                                <input type="password" name="password" id="password" class="form-control"
                                    placeholder="Password" th:field="*{passwordInput}" required>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Login</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        </div>
    </main>
</body>

</html>
