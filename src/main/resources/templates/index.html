<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xml:lang="ja"
    layout:decorate="~{public_layout}">

<head>
    <meta charset="UTF-8">
    <title>トップ</title>
</head>

<body class="bg-light">

    <!-- メインコンテンツ -->
    <main layout:fragment="content" class="container d-flex justify-content-center align-items-center"
        style="min-height: 80vh;">
        <div class="card shadow p-4" style="width: 100%; max-width: 500px;">
            <div class="text-center mb-4">
                <h1 class="h3" th:text="${appName}">TeamSurvey</h1>
                <p class="text-muted">配布されたトークンを入力してください</p>
            </div>

            <!-- エラーメッセージ -->
            <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}">
                エラーメッセージ
            </div>

            <form th:action="@{/enter}" method="post">
                <div class="form-floating mb-3">
                    <input type="text" name="token" class="form-control form-control-lg text-center" id="tokenInput"
                        placeholder="例: abc-123-xyz" required>
                    <label for="tokenInput">配布トークン</label>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg">送信</button>
                </div>
            </form>
        </div>
    </main>
</body>

</html>
