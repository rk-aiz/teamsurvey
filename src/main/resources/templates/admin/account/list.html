<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xml:lang="ja"
    layout:decorate="~{admin/admin_layout}">

<head>
    <title>ユーザーアカウント一覧</title>
</head>

<body>
    <main layout:fragment="content" th:data-show-modal="${showModal}">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-10">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2 class="h3 mb-0">ユーザーアカウント一覧</h2>
                        <div>
                            <a th:href="@{/admin/group/list}" class="btn btn-outline-secondary me-2">
                                <i class="bi bi-people"></i> グループ管理
                            </a>
                            <a th:href="@{/admin/account/list(action='new')}" class="btn btn-primary">
                                <i class="bi bi-person-plus"></i> 新規登録
                            </a>
                        </div>
                    </div>

                    <!-- メッセージ表示 -->
                    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
                    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                    <div class="card shadow-sm">
                        <div class="list-group list-group-flush">
                            <!-- ヘッダー行 -->
                            <div class="list-group-item bg-light text-muted small py-2 d-none d-md-block">
                                <div class="row align-items-center">
                                    <div class="col-md-5">ユーザー情報</div>
                                    <div class="col-md-3">所属グループ</div>
                                    <div class="col-md-2 text-center">ステータス</div>
                                    <div class="col-md-2 text-end">操作</div>
                                </div>
                            </div>

                            <!-- データがない場合 -->
                            <div th:if="${users == null || users.totalElements == 0}"
                                class="p-5 text-center text-muted">
                                <i class="bi bi-people fs-1 mb-3"></i>
                                <p>ユーザーが見つかりません</p>
                            </div>

                            <!-- リストループ -->
                            <div th:each="user : ${users}" class="list-group-item py-3">
                                <div class="row align-items-center">
                                    <!-- ユーザー情報 -->
                                    <div class="col-md-5 mb-2 mb-md-0">
                                        <div class="d-flex align-items-center mb-1">
                                            <h5 class="mb-0 fw-bold text-truncate" th:text="${user.displayName}">ユーザー名
                                            </h5>
                                            <span class="ms-2 badge bg-light text-dark border font-monospace"
                                                th:text="${user.username}">ID</span>
                                        </div>
                                        <div class="text-muted small">
                                            <i class="bi bi-envelope me-1"></i>
                                            <span th:text="${user.email}">user@example.com</span>
                                        </div>
                                    </div>

                                    <!-- 所属グループ -->
                                    <div class="col-md-3 mb-2 mb-md-0">
                                        <div th:if="${#lists.isEmpty(user.assignedGroups)}" class="text-muted small">-
                                        </div>
                                        <div th:unless="${#lists.isEmpty(user.assignedGroups)}">
                                            <span th:each="group : ${user.assignedGroups}"
                                                class="badge bg-secondary-subtle text-secondary border border-secondary me-1 mb-1"
                                                th:text="${group.groupName}">Group</span>
                                        </div>
                                    </div>

                                    <!-- ステータス -->
                                    <div class="col-md-2 text-center mb-2 mb-md-0">
                                        <span th:if="${user.enabled}"
                                            class="badge bg-success-subtle text-success border border-success">有効</span>
                                        <span th:unless="${user.enabled}"
                                            class="badge bg-secondary-subtle text-secondary border border-secondary">無効</span>
                                        <div class="mt-1 text-muted small" style="font-size: 0.75rem;">
                                            登録: <span
                                                th:text="${#temporals.format(user.createdAt, 'yyyy/MM/dd')}"></span>
                                        </div>
                                    </div>

                                    <!-- 操作 -->
                                    <div class="col-md-2 text-end">
                                        <a th:href="@{/admin/account/list(action='edit', username=${user.username})}"
                                            class="btn btn-sm btn-outline-primary">
                                            編集
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- ページネーション -->
                        <div class="card-footer bg-white" th:if="${users != null && users.totalPages > 1}">
                            <nav aria-label="Page navigation">
                                <ul class="pagination justify-content-center mb-0">
                                    <li class="page-item" th:classappend="${users.first} ? 'disabled'">
                                        <a class="page-link" th:href="@{/admin/account/list(page=${users.number - 1})}"
                                            aria-label="Previous">
                                            <span aria-hidden="true">&laquo;</span>
                                        </a>
                                    </li>
                                    <li class="page-item" th:each="i : ${#numbers.sequence(0, users.totalPages - 1)}"
                                        th:classappend="${i == users.number} ? 'active'">
                                        <a class="page-link" th:href="@{/admin/account/list(page=${i})}"
                                            th:text="${i + 1}">1</a>
                                    </li>
                                    <li class="page-item" th:classappend="${users.last} ? 'disabled'">
                                        <a class="page-link" th:href="@{/admin/account/list(page=${users.number + 1})}"
                                            aria-label="Next">
                                            <span aria-hidden="true">&raquo;</span>
                                        </a>
                                    </li>
                                </ul>
                            </nav>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 編集・新規作成モーダル -->
        <!-- showModalフラグがある場合のみレンダリングされる -->
        <div class="modal fade" id="accountModal" tabindex="-1" aria-labelledby="accountModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="accountModalLabel"
                            th:text="${accountForm != null && accountForm.new} ? 'アカウント新規登録' : 'アカウント編集'">編集</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body" th:if="${accountForm != null}">
                        <form th:action="@{/admin/account/save}" method="post" th:object="${accountForm}">
                            <input type="hidden" th:field="*{new}" />
                            <!-- 編集時はユーザー名変更不可 -->
                            <div class="mb-3">
                                <label for="username" class="form-label">ユーザー名</label>
                                <input type="text" class="form-control" th:field="*{username}"
                                    th:disabled="${!accountForm.new}">
                                <input type="hidden" th:field="*{username}" th:if="${!accountForm.new}" />
                            </div>
                            <div class="mb-3">
                                <label for="displayName" class="form-label">表示名</label>
                                <input type="text" class="form-control" th:field="*{displayName}">
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">メールアドレス</label>
                                <input type="email" class="form-control" th:field="*{email}">
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">パスワード</label>
                                <input type="password" class="form-control" th:field="*{password}"
                                    placeholder="変更する場合のみ入力" th:if="${!accountForm.new}" th:errorclass="is-invalid">
                                <input type="password" class="form-control" th:field="*{password}"
                                    th:if="${accountForm.new}" required th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:errors="*{password}"></div>
                            </div>
                            <div class="mb-3">
                                <label for="passwordConfirmation" class="form-label">パスワード（確認）</label>
                                <input type="password" class="form-control" th:field="*{passwordConfirmation}"
                                    th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:errors="*{passwordMatching}"></div>
                            </div>
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" th:field="*{enabled}"
                                    th:disabled="${isLastAdmin}">
                                <label class="form-check-label" for="enabled">有効アカウント</label>
                                <!-- disabledの場合値が送信されないため、hiddenでtrueを送る（最後の管理者は有効のまま維持するため） -->
                                <input type="hidden" name="enabled" value="true" th:if="${isLastAdmin}" />
                                <div th:if="${isLastAdmin}" class="form-text text-danger small">
                                    有効な管理者が残り1名のため、無効化できません。
                                </div>
                            </div>

                            <!-- 所属グループ選択 -->
                            <div class="mb-3">
                                <label class="form-label">所属グループ</label>
                                <div class="card p-2 bg-light" style="max-height: 150px; overflow-y: auto;">
                                    <div th:if="${#lists.isEmpty(userGroups)}" class="text-muted small">
                                        グループが登録されていません
                                    </div>
                                    <div th:each="group : ${userGroups}" class="form-check">
                                        <input class="form-check-input" type="checkbox" th:field="*{groupIds}" th:value="${group.groupId}" th:id="${'group_' + group.groupId}">
                                        <label class="form-check-label" th:for="${'group_' + group.groupId}" th:text="${group.groupName}">Group Name</label>
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary flex-grow-1">保存</button>
                                <a th:if="${!accountForm.new && !isLastAdmin}"
                                    th:href="@{/admin/account/delete(username=*{username})}" class="btn btn-danger"
                                    onclick="return confirm('本当に削除しますか？\nこの操作は取り消せません。');">削除</a>
                                <button th:if="${!accountForm.new && isLastAdmin}" type="button"
                                    class="btn btn-secondary" disabled>削除</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- アカウント一覧用スクリプト -->
        <script th:src="@{/js/admin/account-list.js}"></script>

    </main>
</body>

</html>
