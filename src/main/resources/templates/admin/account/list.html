<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xml:lang="ja"
    layout:decorate="~{admin/admin_layout}">

<head>
    <title>ユーザーアカウント一覧</title>
</head>

<body>
    <main layout:fragment="content" th:data-show-modal="${showModal}">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-10">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2 class="h3 mb-0">ユーザーアカウント一覧</h2>
                        <div>
                            <a th:href="@{/admin/account/list(action='new')}" class="btn btn-primary">
                                <i class="bi bi-person-plus"></i> 新規登録
                            </a>
                        </div>
                    </div>

                    <!-- グループ管理セクション -->
                    <div class="card shadow-sm mb-4">
                        <div class="card-header bg-light py-2">
                            <h5 class="mb-0 fs-6 fw-bold text-secondary"><i class="bi bi-people-fill me-2"></i>グループ管理
                            </h5>
                        </div>
                        <div class="card-body bg-light-subtle">
                            <div class="row g-3">
                                <!-- グループ一覧 -->
                                <div class="col-md-8">
                                    <div class="table-responsive bg-white border rounded">
                                        <table class="table table-sm table-hover mb-0">
                                            <thead class="table-light">
                                                <tr>
                                                    <th class="ps-3">グループ名</th>
                                                    <th>権限</th>
                                                    <th class="text-end pe-3">操作</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <tr th:each="group : ${userGroups}">
                                                    <td class="ps-3 align-middle">
                                                        <span th:text="${group.groupName}"></span>
                                                        <span th:if="${group.systemGroup}"
                                                            class="badge bg-info-subtle text-info-emphasis border border-info-subtle ms-1"
                                                            style="font-size: 0.7em;">SYSTEM</span>
                                                    </td>
                                                    <td class="align-middle">
                                                        <span th:if="${group.authority != null}"
                                                            th:text="${group.authority.name() == 'ADMIN' ? '管理者' : (group.authority.name() == 'USER' ? '一般' : group.authority)}"
                                                            class="badge"
                                                            th:classappend="${group.authority.name() == 'ADMIN' ? 'bg-danger' : 'bg-secondary'}"></span>
                                                    </td>
                                                    <td class="text-end pe-3">
                                                        <button type="button"
                                                            class="btn btn-sm btn-link text-primary p-0 me-2 edit-group-btn"
                                                            th:data-group-id="${group.id}"
                                                            th:data-group-name="${group.groupName}"
                                                            th:data-authority="${group.authority}"
                                                            th:data-is-system-group="${group.systemGroup}">
                                                            <i class="bi bi-pencil-square"></i>
                                                        </button>
                                                        <form th:action="@{/admin/group/delete}" method="post"
                                                            style="display:inline;" th:unless="${group.systemGroup}">
                                                            <input type="hidden" name="id" th:value="${group.id}">
                                                            <button type="submit"
                                                                class="btn btn-sm btn-link text-danger p-0"
                                                                onclick="return confirm('このグループを削除しますか？所属ユーザーの設定も解除されます。')">
                                                                <i class="bi bi-trash"></i>
                                                            </button>
                                                        </form>
                                                    </td>
                                                </tr>
                                                <tr th:if="${#lists.isEmpty(userGroups)}">
                                                    <td colspan="3" class="text-center text-muted small py-3">
                                                        グループが登録されていません</td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                                <!-- 新規作成フォーム -->
                                <div class="col-md-4">
                                    <div class="card h-100 border-0 bg-transparent">
                                        <div class="card-body p-0">
                                            <h6 id="groupFormTitle" class="card-title small text-muted mb-2">
                                                新規グループ追加</h6>
                                            <form th:action="@{/admin/group/save}" method="post" id="groupForm"
                                                th:object="${userGroupForm}">
                                                <input type="hidden" th:field="*{id}" id="groupFormId">
                                                <div class="mb-2">
                                                    <input type="text" th:field="*{groupName}" id="groupFormName"
                                                        class="form-control form-control-sm" placeholder="グループ名"
                                                        th:errorclass="is-invalid" required>
                                                    <div class="invalid-feedback" th:errors="*{groupName}"></div>
                                                </div>
                                                <div class="mb-2">
                                                    <select th:field="*{authority}" class="form-select form-select-sm"
                                                        th:errorclass="is-invalid">
                                                        <option
                                                            th:each="auth : ${T(com.github.rk_aiz.teamsurvey.domain.type.Authority).values()}"
                                                            th:value="${auth}" th:text="${auth.label}"></option>
                                                    </select>
                                                    <div class="invalid-feedback" th:errors="*{authority}"></div>
                                                </div>
                                                <button type="submit" class="btn btn-sm btn-secondary w-100"
                                                    id="groupFormSubmitBtn">
                                                    <i class="bi bi-plus-lg me-1"></i><span class="btn-text">追加</span>
                                                </button>
                                                <button type="button"
                                                    class="btn btn-sm btn-outline-secondary w-100 mt-2 d-none"
                                                    id="groupFormCancelBtn">
                                                    キャンセル
                                                </button>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card shadow-sm">
                        <div class="list-group list-group-flush">
                            <!-- ヘッダー行 -->
                            <div class="list-group-item bg-light text-muted small py-2 d-none d-md-block">
                                <div class="row align-items-center">
                                    <div class="col-md-5">ユーザー情報</div>
                                    <div class="col-md-3">所属グループ</div>
                                    <div class="col-md-2 text-center">ステータス</div>
                                    <div class="col-md-2 text-end">操作</div>
                                </div>
                            </div>

                            <!-- データがない場合 -->
                            <div th:if="${users == null || users.totalElements == 0}"
                                class="p-5 text-center text-muted">
                                <i class="bi bi-people fs-1 mb-3"></i>
                                <p>ユーザーが見つかりません</p>
                            </div>

                            <!-- リストループ -->
                            <div th:each="user : ${users}" class="list-group-item py-3">
                                <div class="row align-items-center">
                                    <!-- ユーザー情報 -->
                                    <div class="col-md-5 mb-2 mb-md-0">
                                        <div class="d-flex align-items-center mb-1">
                                            <h5 class="mb-0 fw-bold text-truncate" th:text="${user.displayName}">ユーザー名
                                            </h5>
                                            <span class="ms-2 badge bg-light text-dark border font-monospace"
                                                th:text="${user.username}">ID</span>
                                        </div>
                                        <div class="text-muted small">
                                            <i class="bi bi-envelope me-1"></i>
                                            <span th:text="${user.email}">user@example.com</span>
                                        </div>
                                    </div>

                                    <!-- 所属グループ -->
                                    <div class="col-md-3 mb-2 mb-md-0">
                                        <div th:if="${#lists.isEmpty(user.assignedGroups)}" class="text-muted small">-
                                        </div>
                                        <div th:unless="${#lists.isEmpty(user.assignedGroups)}">
                                            <span th:each="group : ${user.assignedGroups}"
                                                class="badge bg-secondary-subtle text-secondary border border-secondary me-1 mb-1"
                                                th:text="${group.groupName}">Group</span>
                                        </div>
                                    </div>

                                    <!-- ステータス -->
                                    <div class="col-md-2 text-center mb-2 mb-md-0">
                                        <span th:if="${user.enabled}"
                                            class="badge bg-success-subtle text-success border border-success">有効</span>
                                        <span th:unless="${user.enabled}"
                                            class="badge bg-secondary-subtle text-secondary border border-secondary">無効</span>
                                        <div class="mt-1 text-muted small" style="font-size: 0.75rem;">
                                            登録: <span
                                                th:text="${#temporals.format(user.createdAt, 'yyyy/MM/dd')}"></span>
                                        </div>
                                    </div>

                                    <!-- 操作 -->
                                    <div class="col-md-2 text-end text-nowrap">
                                        <a th:href="@{/admin/account/list(action='edit', username=${user.username})}"
                                            class="btn btn-sm btn-outline-primary me-1">
                                            編集
                                        </a>
                                        <a th:href="@{/admin/account/delete(username=${user.username})}"
                                            class="btn btn-sm btn-outline-danger"
                                            onclick="return confirm('本当に削除しますか？\nこの操作は取り消せません。');">
                                            削除
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- ページネーション -->
                        <div class="card-footer bg-white" th:if="${users != null && users.totalPages > 1}">
                            <nav aria-label="Page navigation">
                                <ul class="pagination justify-content-center mb-0">
                                    <li class="page-item" th:classappend="${users.first} ? 'disabled'">
                                        <a class="page-link" th:href="@{/admin/account/list(page=${users.number - 1})}"
                                            aria-label="Previous">
                                            <span aria-hidden="true">&laquo;</span>
                                        </a>
                                    </li>
                                    <li class="page-item" th:each="i : ${#numbers.sequence(0, users.totalPages - 1)}"
                                        th:classappend="${i == users.number} ? 'active'">
                                        <a class="page-link" th:href="@{/admin/account/list(page=${i})}"
                                            th:text="${i + 1}">1</a>
                                    </li>
                                    <li class="page-item" th:classappend="${users.last} ? 'disabled'">
                                        <a class="page-link" th:href="@{/admin/account/list(page=${users.number + 1})}"
                                            aria-label="Next">
                                            <span aria-hidden="true">&raquo;</span>
                                        </a>
                                    </li>
                                </ul>
                            </nav>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 編集・新規作成モーダル -->
        <!-- showModalフラグがある場合のみレンダリングされる -->
        <div class="modal fade" id="accountModal" tabindex="-1" aria-labelledby="accountModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="accountModalLabel"
                            th:text="${accountForm != null && accountForm.isNew} ? 'アカウント新規登録' : 'アカウント編集'">編集</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body" th:if="${accountForm != null}">
                        <th:block th:replace="~{admin/account/edit_fragments :: account-form}"></th:block>
                    </div>
                </div>
            </div>
        </div>

        <!-- アカウント一覧用スクリプト -->
        <script th:src="@{/js/admin/account-list.js}"></script>

    </main>
</body>

</html>
