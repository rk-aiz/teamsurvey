<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xml:lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE" th:text="${appName} + ' Admin'">
        Questionnaire
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script>
        // テーマ初期化: ローカルストレージを確認し、なければ'light'（デフォルト）
        const getStoredTheme = () => localStorage.getItem('theme');
        const setStoredTheme = theme => localStorage.setItem('theme', theme);
        const getPreferredTheme = () => {
            const storedTheme = getStoredTheme();
            return storedTheme ? storedTheme : 'light';
        }
        document.documentElement.setAttribute('data-bs-theme', getPreferredTheme());
    </script>
</head>

<body class="d-flex flex-column min-vh-100">
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom shadow-sm">
            <div class="container">
                <a class="navbar-brand fw-bold" href="/admin/enquete/list" th:text="${appName} + ' Admin'">mini Enquete
                    Admin</a>
                <div class="d-flex align-items-center">
                    <!-- テーマ切り替えボタン -->
                    <button class="btn btn-outline-secondary btn-sm me-3" id="themeToggle" type="button" title="テーマ切替">
                        <i class="bi bi-sun-fill" id="themeIcon"></i>
                    </button>
                    <form th:action="@{/logout}" method="post">
                        <button class="btn btn-sm btn-outline-danger">ログアウト</button>
                    </form>
                </div>
            </div>
        </nav>
    </header>

    <main layout:fragment="content" class="container py-4 flex-grow-1"></main>

    <footer class="py-3 mt-auto bg-body-tertiary border-top">
        <div class="container text-center">
            <p class="mb-0 text-muted small">
                &copy; 2025
                <a href="https://github.com/rk-aiz/teamsurvey">github.com/rk-aiz/teamsurvey</a>
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.getElementById('themeToggle');
            const icon = document.getElementById('themeIcon');

            // アイコンの初期表示設定
            if (document.documentElement.getAttribute('data-bs-theme') === 'dark') {
                icon.className = 'bi bi-moon-fill';
            }

            toggleBtn.addEventListener('click', () => {
                const currentTheme = document.documentElement.getAttribute('data-bs-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-bs-theme', newTheme);
                setStoredTheme(newTheme);
                icon.className = newTheme === 'dark' ? 'bi bi-moon-fill' : 'bi bi-sun-fill';
            });
        });
    </script>
</body>

</html>
