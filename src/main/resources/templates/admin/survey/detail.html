<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xml:lang="ja"
    layout:decorate="~{admin/admin_layout}">

<head>
    <title th:text="${title} ?: 'アンケート詳細'">アンケート詳細</title>

    <style>
        /* プレビュー時のdisabled要素の視認性向上(ダークモード対応) */
        .survey-preview .form-control:disabled {
            background-color: var(--bs-secondary-bg);
            color: var(--bs-body-color);
            opacity: 1;
        }

        .survey-preview .form-check-input:disabled,
        .survey-preview .form-check-input:disabled~.form-check-label {
            opacity: 1;
            color: var(--bs-body-color);
        }
    </style>
</head>

<body>
    <main layout:fragment="content">
        <h2>アンケート詳細</h2>
        <table class="table table-bordered">
            <tr>
                <th>ID</th>
                <td th:text="${survey.id}"></td>
            </tr>
            <tr>
                <th>タイトル</th>
                <td th:text="${survey.title}"></td>
            </tr>
            <tr>
                <th>ステータス</th>
                <td>
                    <strong th:text="${survey.status}"
                        th:style="${survey.status.name() == 'PUBLISHED' ? 'color:green' : ''}"></strong>
                </td>
            </tr>
            <tr>
                <th>回答対象グループ</th>
                <td>
                    <span th:each="group : ${survey.targetGroups}" class="badge bg-secondary me-1"
                        th:text="${group.groupName}"></span>
                    <div th:if="${#lists.isEmpty(survey.targetGroups)}" class="text-muted">
                        指定なし
                    </div>
                </td>
            </tr>
            <tr>
                <th>締め切り日時</th>
                <td
                    th:text="${survey.deadline != null ? #temporals.format(survey.deadline, 'yyyy-MM-dd HH:mm') : '無期限'}">
                </td>
            </tr>
            <tr>
                <th>作成日時</th>
                <td th:text="${#temporals.format(survey.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
            </tr>
            <tr>
                <th>更新日時</th>
                <td th:text="${#temporals.format(survey.updatedAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
            </tr>
        </table>

        <!--/* ステータス変更アクション */-->
        <div class="p-3 my-4 border rounded bg-body-tertiary">
            <h4 class="mb-3">ステータス変更</h4>
            <div class="d-flex flex-wrap gap-2">

                <!--/* 下書き(DRAFT)の場合 -> 公開 (回答受付) */-->
                <th:block th:if="${survey.status.name() == 'DRAFT'}">
                    <form th:action="@{/admin/survey/status/{id}(id=${survey.id})}" method="post">
                        <input type="hidden" name="status" value="PUBLISHED">
                        <button type="submit" onclick="return confirm('回答受付状態にしますか？')" class="btn btn-success">
                            公開する(回答受付状態)
                        </button>
                    </form>
                </th:block>

                <!--/* 公開中(PUBLISHED)の場合 -> 終了 or 下書き */-->
                <th:block th:if="${survey.status.name() == 'PUBLISHED'}">
                    <form th:action="@{/admin/survey/status/{id}(id=${survey.id})}" method="post">
                        <input type="hidden" name="status" value="CLOSED">
                        <button type="submit" onclick="return confirm('回答受付を終了しますか？')" class="btn btn-secondary">
                            締め切る
                        </button>
                    </form>
                </th:block>

                <!--/* 終了(CLOSED)の場合 -> 再公開 */-->
                <th:block th:if="${survey.status.name() == 'CLOSED'}">
                    <form th:action="@{/admin/survey/status/{id}(id=${survey.id})}" method="post">
                        <input type="hidden" name="status" value="PUBLISHED">
                        <button type="submit" onclick="return confirm('再公開しますか？')" class="btn btn-success">
                            再公開する
                        </button>
                    </form>
                </th:block>

                <!--/* 対象グループ設定 */-->
                <button type="button" class="btn btn-primary text-white" data-bs-toggle="modal"
                    data-bs-target="#targetGroupModal">
                    対象グループ設定
                </button>

                <!--/* 削除 (DRAFT or CLOSED) */-->
                <th:block th:if="${survey.status.name() == 'DRAFT' or survey.status.name() == 'CLOSED'}">
                    <form th:action="@{/admin/survey/status/{id}(id=${survey.id})}" method="post">
                        <input type="hidden" name="status" value="DELETED">
                        <button type="submit" onclick="return confirm('本当に削除しますか？この操作は取り消せません。')"
                            class="btn btn-danger">
                            削除
                        </button>
                    </form>
                </th:block>
            </div>
        </div>

        <hr>
        <h3>アンケート内容(プレビュー)</h3>
        <div class="survey-preview">
            <div th:each="question, stat : ${survey.questions}" class="card mb-3 p-3">
                <div class="d-flex align-items-start" style="font-weight: bold; margin-bottom: 10px;">
                    <h5 class="me-2 mb-0" style="white-space: nowrap;" th:text="'Q' + ${stat.count} + '.'">Q1.</h5>
                    <span th:if="${question.required}" class="badge bg-danger me-2"
                        style="white-space: nowrap;">必須</span>
                    <span th:text="${question.text}" style="white-space: pre-wrap;">設問文</span>
                </div>
                <div>
                    <!--/* 設問タイプ(TEXT, RADIO, CHECKBOX)によって出し分け */-->
                    <div th:if="${question.type.name() == 'TEXT'}">
                        <input type="text" class="form-control" placeholder="回答入力欄" disabled style="width: 50%;">
                    </div>

                    <div th:if="${question.type.name() == 'RADIO'}" class="ms-3 p-3 border rounded bg-body-tertiary">
                        <div class="form-check" th:each="item : ${question.answerOption.items}">
                            <input type="radio" class="form-check-input" disabled>
                            <label class="form-check-label" th:text="${item.itemText}">選択肢</label>
                        </div>
                    </div>

                    <div th:if="${question.type.name() == 'CHECKBOX'}" class="ms-3 p-3 border rounded bg-body-tertiary">
                        <div class="form-check" th:each="item : ${question.answerOption.items}">
                            <input type="checkbox" class="form-check-input" disabled>
                            <label class="form-check-label" th:text="${item.itemText}">選択肢</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <a th:href="@{/admin/survey/edit/{id}(id=${survey.id})}" class="btn btn-primary">編集する</a>
        <a th:href="@{/admin/survey/list}" class="btn btn-outline-secondary">一覧に戻る</a>

        <!--/* TODO 回答パターンスナップショットの関係で、複製機能は一時凍結
        <div
            style="margin-top: 50px; border-top: 1px solid #eee; padding-top: 10px; text-align: right; font-size: 0.9em;">
            <span style="color: #666;">その他の操作:</span>
            <a th:href="@{/admin/survey/copy/{id}(id=${survey.id})}"
                onclick="return confirm('このアンケートを複製して新規作成しますか？')" style="color: #666;">複製して新規作成</a>
        </div>
        */-->

        <!--/* 対象グループ設定モーダル */-->
        <div class="modal fade" id="targetGroupModal" tabindex="-1" aria-labelledby="targetGroupModalLabel"
            aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <form th:action="@{/admin/survey/target/{id}(id=${survey.id})}" method="post">
                        <div class="modal-header">
                            <h5 class="modal-title" id="targetGroupModalLabel">回答対象グループ設定</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <p class="small text-muted">選択したグループのユーザーのみが回答できます。</p>
                            <div class="d-flex flex-wrap gap-2">
                                <th:block th:each="group : ${userGroups}">
                                    <input type="checkbox" class="btn-check" name="groupIds"
                                        th:id="${'modal_group_' + group.id}" th:value="${group.id}"
                                        th:checked="${survey.targetGroups != null and #lists.contains(survey.targetGroups.![id], group.id)}"
                                        autocomplete="off">
                                    <label class="btn btn-outline-primary" th:for="${'modal_group_' + group.id}"
                                        th:text="${group.groupName}"></label>
                                </th:block>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
                            <button type="submit" class="btn btn-primary">保存</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
