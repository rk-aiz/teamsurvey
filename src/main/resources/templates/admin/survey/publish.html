<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xml:lang="ja"
    layout:decorate="~{admin/admin_layout}">

<head>
    <title>アンケート公開設定</title>
</head>

<body>
    <main layout:fragment="content">
        <h2>アンケート公開設定</h2>
        <p>アンケートを公開する前に、配布用の設定を確認してください。</p>

        <form th:action="@{/admin/enquete/publish}" method="post" th:object="${enquete}">
            <input type="hidden" th:field="*{id}">

            <table class="table table-bordered mb-4">
                <tr>
                    <th>タイトル</th>
                    <td th:text="*{title}"></td>
                </tr>
                <tr>
                    <th>締め切り日時</th>
                    <td>
                        <input type="datetime-local" th:field="*{deadline}" class="form-control" style="width: auto;">
                        <br>
                        <small>※公開と同時に締め切りを変更することも可能です。</small>
                    </td>
                </tr>
            </table>

            <div
                style="background-color: #e8f5e9; padding: 15px; border: 1px solid #c8e6c9; border-radius: 5px; margin-bottom: 20px;">
                <strong>確認:</strong>
                一度公開すると、設問の構成（追加・削除・タイプ変更）はできなくなります。<br>
                内容に間違いがないか、再度ご確認ください。
            </div>

            <div>
                <button type="submit" class="btn btn-success fw-bold px-4">公開を確定する</button>
                <a th:href="@{/admin/enquete/detail/{id}(id=*{id})}" class="btn btn-link ms-3">キャンセル</a>
            </div>
        </form>

    </main>
</body>

</html>
