<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xml:lang="ja"
    layout:decorate="~{admin/admin_layout}">

<head>
    <title>回答トークン管理</title>
</head>

<body>
    <main layout:fragment="content">
        <h2>回答トークン管理</h2>
        <p>アンケート「<strong th:text="${enquete.title}"></strong>」の配布用URLを管理します。</p>

        <!-- メッセージ表示エリア -->
        <div th:if="${message}" th:text="${message}"
            style="color: #155724; background-color: #d4edda; border-color: #c3e6cb; padding: 10px; border-radius: 5px; margin-bottom: 15px;">
        </div>
        <div th:if="${errorMessage}" th:text="${errorMessage}"
            style="color: #721c24; background-color: #f8d7da; border-color: #f5c6cb; padding: 10px; border-radius: 5px; margin-bottom: 15px;">
        </div>

        <div
            style="margin-bottom: 30px; padding: 15px; background-color: #f8f9fa; border: 1px solid #dee2e6; border-radius: 5px;">
            <h4>新規作成 (共有URL)</h4>
            <form th:action="@{/admin/enquete/distribution/create}" method="post"
                style="display: flex; gap: 10px; align-items: center;">
                <input type="hidden" name="enqueteId" th:value="${enquete.id}">

                <label>トークン(URL末尾):</label>
                <input type="text" name="token" th:value="${defaultToken}" required class="form-control"
                    style="width: 200px;" pattern="^[a-zA-Z0-9_-]+$">

                <button type="submit" class="btn btn-success">
                    追加
                </button>
                <small style="color: #666;">※半角英数字、ハイフン、アンダースコアのみ使用可能</small>
            </form>
        </div>

        <div
            style="margin-bottom: 30px; padding: 15px; background-color: #fff3cd; border: 1px solid #ffeeba; border-radius: 5px;">
            <h4>新規作成 (個別URL)</h4>
            <form th:action="@{/admin/enquete/distribution/createUnique}" method="post"
                style="display: flex; gap: 10px; align-items: center;">
                <input type="hidden" name="enqueteId" th:value="${enquete.id}">

                <label>発行数:</label>
                <input type="number" name="quantity" value="1" min="1" max="100" class="form-control"
                    style="width: 80px;">

                <button type="submit" class="btn btn-warning">
                    発行
                </button>
                <small style="color: #666;">※指定した数のユニークURL(1回使い切り)を一括生成します</small>
            </form>
        </div>

        <h3>登録済みトークン一覧</h3>
        <table class="table table-striped table-hover mb-4">
            <thead style="background-color: #eee;">
                <tr>
                    <th style="padding: 8px;">タイプ</th>
                    <th style="padding: 8px;">トークン</th>
                    <th style="padding: 8px;">割当ID</th>
                    <th style="padding: 8px;">配布用URL (例)</th>
                    <th style="padding: 8px;">操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${tokens.isEmpty()}">
                    <td colspan="5" style="padding: 10px; text-align: center;">登録された公開トークンはありません。</td>
                </tr>
                <tr th:each="token : ${tokens}">
                    <td style="padding: 8px; text-align: center;" th:text="${token.type.label}">共有URL</td>
                    <td style="padding: 8px; font-family: monospace;" th:text="${token.token}">abc-123</td>
                    <td style="padding: 8px;" th:text="${token.assignedUserId}"></td>
                    <td style="padding: 8px;">
                        <a href="#" th:text="'/enquete/answer/' + ${token.token}" onclick="return false;">URL</a>
                    </td>
                    <td style="padding: 8px; text-align: center;">
                        <form th:action="@{/admin/enquete/distribution/delete}" method="post" style="display: inline;">
                            <input type="hidden" name="id" th:value="${token.id}">
                            <input type="hidden" name="enqueteId" th:value="${enquete.id}">
                            <button type="submit" onclick="return confirm('このコードを削除してもよろしいですか？\nこのURLからは回答できなくなります。')"
                                class="btn btn-sm btn-danger">削除</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>

        <a th:href="@{/admin/enquete/detail/{id}(id=${enquete.id})}" class="btn btn-link">詳細に戻る</a>
    </main>
</body>

</html>
