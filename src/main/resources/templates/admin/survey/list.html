<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xml:lang="ja"
    layout:decorate="~{admin/admin_layout}">

<head>
    <title>アンケート一覧</title>
</head>

<body>
    <main layout:fragment="content">
        <div class="row g-4">
            <!--/* 左カラム: 操作・ナビゲーション (col-lg-2) */-->
            <div class="col-lg-2">
                <div class="d-grid gap-2 mb-4">
                    <a th:href="@{/admin/survey/new}" class="btn btn-primary shadow-sm">
                        <i class="bi bi-plus-lg"></i> 新規作成
                    </a>
                </div>
                <div class="list-group list-group-flush shadow-sm rounded">
                    <a href="#" class="list-group-item list-group-item-action" data-filter-type="ALL">
                        <i class="bi bi-list-ul me-2"></i> すべて
                    </a>
                    <a href="#" class="list-group-item list-group-item-action" data-filter-type="DRAFT">
                        <i class="bi bi-pencil me-2"></i> 下書き
                    </a>
                    <a href="#" class="list-group-item list-group-item-action" data-filter-type="PUBLISHED">
                        <i class="bi bi-send me-2"></i> 公開中
                    </a>
                    <a href="#" class="list-group-item list-group-item-action" data-filter-type="CLOSED">
                        <i class="bi bi-check-circle me-2"></i> 終了
                    </a>
                </div>
                <a th:href="@{/}" class="btn btn-link mt-3 text-decoration-none text-muted small">
                    <i class="bi bi-arrow-left"></i> メニューへ戻る
                </a>
            </div>

            <!--/* 中央カラム: アンケート一覧 (col-lg-6) */-->
            <div class="col-lg-6">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-transparent py-3">
                        <h5 class="card-title mb-0">アンケート一覧</h5>
                    </div>
                    <div class="list-group list-group-flush overflow-auto" style="max-height: 70vh;">
                        <!--/* 一覧ループ */-->
                        <a th:each="survey : ${surveys}" th:href="@{/admin/survey/list(id=${survey.id})}"
                            class="list-group-item list-group-item-action py-3 survey-item"
                            th:data-survey-status="${survey.status}"
                            th:classappend="${selectedSurvey != null && selectedSurvey.id == survey.id} ? 'list-group-item-primary' : ''">
                            <div class="d-flex w-100 justify-content-between align-items-center mb-1">
                                <h6 class="mb-1 fw-bold text-truncate" th:text="${survey.title}">タイトル</h6>
                                <small class="text-muted" th:text="'#' + ${survey.id}">#1</small>
                            </div>
                            <div class="d-flex align-items-center gap-2">
                                <!--/* ステータスバッジ */-->
                                <span th:if="${survey.status.name() == 'DRAFT'}"
                                    class="badge bg-secondary-subtle text-secondary border border-secondary small">下書き</span>
                                <span th:if="${survey.status.name() == 'PUBLISHED'}"
                                    class="badge bg-success-subtle text-success border border-success small">公開中</span>
                                <span th:if="${survey.status.name() == 'CLOSED'}"
                                    class="badge bg-danger-subtle text-danger border border-danger small">終了</span>

                                <small class="text-muted">
                                    <i class="bi bi-clock"></i>
                                    <span th:text="${#temporals.format(survey.createdAt, 'MM/dd')}">01/01</span>
                                </small>
                            </div>
                        </a>

                        <!--/* データ0件時のメッセージ */-->
                        <div th:if="${#lists.isEmpty(surveys)}" class="p-4 text-center text-muted">
                            アンケートがありません
                        </div>
                        <!--/* フィルタ結果0件時のメッセージ (JSで制御) */-->
                        <div id="no-surveys-message" class="p-4 text-center text-muted" style="display: none;">
                            条件に一致するアンケートはありません
                        </div>
                    </div>
                </div>
            </div>

            <!--/* 右カラム: 選択項目の詳細プレビュー (col-lg-4) */-->
            <div class="col-lg-4" id="detail-pane">
                <div th:if="${selectedSurvey != null}" class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-start mb-4">
                            <div>
                                <h3 class="fw-bold mb-1" th:text="${selectedSurvey.title}">アンケートタイトル</h3>
                                <p class="text-muted mb-0">作成日: <span
                                        th:text="${#temporals.format(selectedSurvey.createdAt, 'yyyy/MM/dd HH:mm')}"></span>
                                </p>
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-6">
                                <div class="p-3 border rounded bg-body-tertiary">
                                    <small class="text-muted d-block">ステータス</small>
                                    <span class="fw-bold" th:text="${selectedSurvey.status}">DRAFT</span>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="p-3 border rounded bg-body-tertiary">
                                    <small class="text-muted d-block">回答期限</small>
                                    <span class="fw-bold"
                                        th:text="${selectedSurvey.deadline != null ? #temporals.format(selectedSurvey.deadline, 'yyyy/MM/dd') : '無期限'}">無期限</span>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex gap-2 mb-3">
                            <a th:href="@{/admin/survey/detail/{id}(id=${selectedSurvey.id})}"
                                class="btn btn-sm btn-outline-primary">
                                <i class="bi bi-eye"></i> 詳細画面を開く
                            </a>
                            <!--/* TODO 回答パターンスナップショットの関係で、複製機能は一時凍結
                            <a th:href="@{/admin/survey/copy/{id}(id=${selectedSurvey.id})}"
                                class="btn btn-outline-secondary">
                                <i class="bi bi-copy"></i> 複製
                            </a> */-->
                        </div>

                        <!--/* ステータス変更・削除アクション */-->
                        <div class="card bg-body-tertiary border-0">
                            <div class="card-body p-3">
                                <h6 class="card-subtitle mb-2 text-muted small">アクション</h6>
                                <div class="d-flex flex-wrap gap-2 align-items-center">
                                    <!--/* 編集 */-->
                                    <a th:href="@{/admin/survey/edit/{id}(id=${selectedSurvey.id})}"
                                        class="btn btn-sm btn-outline-primary">
                                        <i class="bi bi-pencil"></i> 編集
                                    </a>
                                    <!--/* 公開 */-->
                                    <form th:if="${selectedSurvey.status.name() == 'DRAFT'}"
                                        th:action="@{/admin/survey/status/{id}(id=${selectedSurvey.id})}" method="post">
                                        <input type="hidden" name="status" value="PUBLISHED">
                                        <button type="submit" class="btn btn-sm btn-success"
                                            onclick="return confirm('回答受付状態にしますか？')">
                                            <i class="bi bi-send"></i> 公開する
                                        </button>
                                    </form>
                                    <!--/* 終了 */-->
                                    <form th:if="${selectedSurvey.status.name() == 'PUBLISHED'}"
                                        th:action="@{/admin/survey/status/{id}(id=${selectedSurvey.id})}" method="post">
                                        <input type="hidden" name="status" value="CLOSED">
                                        <button type="submit" class="btn btn-sm btn-secondary"
                                            onclick="return confirm('回答受付を終了しますか？')">
                                            <i class="bi bi-stop-circle"></i> 締め切る
                                        </button>
                                    </form>
                                    <!--/* 再公開 */-->
                                    <form th:if="${selectedSurvey.status.name() == 'CLOSED'}"
                                        th:action="@{/admin/survey/status/{id}(id=${selectedSurvey.id})}" method="post">
                                        <input type="hidden" name="status" value="PUBLISHED">
                                        <button type="submit" class="btn btn-sm btn-success"
                                            onclick="return confirm('再公開しますか？')">
                                            <i class="bi bi-arrow-repeat"></i> 再公開
                                        </button>
                                    </form>

                                    <!--/* 削除 (DRAFT or CLOSED) */-->
                                    <form
                                        th:if="${selectedSurvey.status.name() == 'DRAFT' or selectedSurvey.status.name() == 'CLOSED'}"
                                        th:action="@{/admin/survey/status/{id}(id=${selectedSurvey.id})}" method="post"
                                        class="ms-auto">
                                        <input type="hidden" name="status" value="DELETED">
                                        <button type="submit" class="btn btn-sm btn-outline-danger"
                                            onclick="return confirm('本当に削除しますか？この操作は取り消せません。')">
                                            <i class="bi bi-trash"></i> 削除
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!--/* 未選択時の表示 */-->
                <div th:if="${selectedSurvey == null}"
                    class="card shadow-sm border-0 h-100 d-flex align-items-center justify-content-center bg-body-tertiary">
                    <div class="text-center p-5">
                        <i class="bi bi-cursor fs-1 text-muted mb-3"></i>
                        <p class="text-muted">一覧からアンケートを選択すると<br>ここに詳細が表示されます</p>
                    </div>
                </div>
            </div>
        </div>
        <!--/* 一覧画面用スクリプト */-->
        <script th:src="@{/js/admin/survey-list.js}"></script>
    </main>
</body>

</html>
