<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xml:lang="ja"
    layout:decorate="~{admin/admin_layout}">

<head>
    <title>回答パターン一覧</title>
</head>

<body>
    <main layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>回答パターン一覧</h2>
            <a th:href="@{/admin/pattern/new}" class="btn btn-primary">
                <i class="bi bi-plus-lg"></i> 新規パターン作成
            </a>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th style="width: 100px;">ID</th>
                            <th>パターン名</th>
                            <th>選択肢(プレビュー)</th>
                            <th style="width: 150px;">操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="option : ${answerOptions}">
                            <td th:text="${option.answerOptionId}">1</td>
                            <td th:text="${option.name}" class="fw-bold">満足度5段階</td>
                            <td>
                                <span th:each="item : ${option.items}" class="badge border text-dark bg-body-tertiary me-1"
                                    th:text="${item.itemText}"></span>
                            </td>
                            <td>
                                <a th:href="@{/admin/pattern/edit/{id}(id=${option.answerOptionId})}"
                                    class="btn btn-sm btn-outline-primary">編集</a>
                                <button class="btn btn-sm btn-outline-danger"
                                    onclick="return confirm('このパターンを削除しますか？')">削除</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="mt-4">
            <a th:href="@{/admin/survey/list}" class="btn btn-link">アンケート一覧に戻る</a>
        </div>
    </main>
</body>

</html>
