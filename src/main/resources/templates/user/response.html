<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xml:lang="ja"
    layout:decorate="~{public_layout}">

<head>
    <meta charset="UTF-8">
    <title th:text="${enquete.title}">アンケート回答</title>
</head>

<body>
    <main layout:fragment="content" class="container py-5 flex-grow-1" style="max-width: 800px;">

        <!-- アンケートヘッダー -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h1 class="card-title h3" th:text="${enquete.title}">タイトル</h1>
                <p class="card-text text-muted">
                    締め切り: <span
                        th:text="${enquete.deadline != null ? #temporals.format(enquete.deadline, 'yyyy/MM/dd HH:mm') : '無期限'}"></span>
                </p>
            </div>
        </div>

        <!-- 回答フォーム -->
        <form th:action="@{/enquete/response/submit}" method="post" th:object="${responseForm}">
            <input type="hidden" th:field="*{token}">
            <input type="hidden" th:field="*{enqueteId}">

            <!-- 質問ループ -->
            <div th:each="question, stat : ${enquete.questions}" class="card mb-3 p-3">
                <div style="font-weight: bold; margin-bottom: 10px;">
                    <span th:text="'Q' + ${stat.count} + '.'">Q1.</span>
                    <span th:text="${question.text}">質問文</span>
                    <span th:if="${question.required}" class="badge bg-danger ms-2" style="font-size: 0.75em;">必須</span>
                </div>

                <div>
                    <!-- 質問ID (バインド用) -->
                    <input type="hidden" th:field="*{details[__${stat.index}__].questionId}">

                    <!-- TEXT (自由記述) -->
                    <div th:if="${question.textType}">
                        <textarea class="form-control" rows="3" th:field="*{details[__${stat.index}__].responseText}"
                            th:required="${question.required}"></textarea>
                    </div>

                    <!-- RADIO (単一選択) -->
                    <div th:if="${question.radioType}">
                        <div th:each="item, itemStat : ${question.answerPattern.items}" class="form-check">
                            <input class="form-check-input" type="radio"
                                th:id="${'radio_' + stat.index + '_' + item.id}"
                                th:field="*{details[__${stat.index}__].radioOptionId}" th:value="${item.id}"
                                th:required="${question.required}">
                            <label class="form-check-label" th:for="${'radio_' + stat.index + '_' + item.id}"
                                th:text="${item.itemText}"></label>
                        </div>
                    </div>

                    <!-- CHECKBOX (複数選択) -->
                    <div th:if="${question.checkboxType}">
                        <div th:each="item, itemStat : ${question.answerPattern.items}" class="form-check">
                            <input class="form-check-input" type="checkbox"
                                th:id="${'check_' + stat.index + '_' + item.id}"
                                th:field="*{details[__${stat.index}__].checkboxOptionIds}" th:value="${item.id}">
                            <label class="form-check-label" th:for="${'check_' + stat.index + '_' + item.id}"
                                th:text="${item.itemText}"></label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-primary btn-lg px-5">回答を送信する</button>
            </div>
        </form>
    </main>
</body>

</html>
