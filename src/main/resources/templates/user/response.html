<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xml:lang="ja"
    layout:decorate="~{ ${layout} }">

<head>
    <meta charset="UTF-8">
    <title th:text="${survey.title}">アンケート回答</title>
</head>

<body>
    <main layout:fragment="content" class="container py-5 flex-grow-1" style="max-width: 800px;">

        <!-- アンケートヘッダー -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h1 class="card-title h3" th:text="${survey.title}">タイトル</h1>
                <p class="card-text text-muted">
                    締め切り: <span
                        th:text="${survey.deadline != null ? #temporals.format(survey.deadline, 'yyyy/MM/dd HH:mm') : '無期限'}"></span>
                </p>
            </div>
        </div>

        <!-- 回答フォーム -->
        <form th:action="@{/response/submit}" method="post" th:object="${responseForm}">
            <input type="hidden" th:field="*{username}">
            <input type="hidden" th:field="*{surveyId}">

            <!-- 質問ループ -->
            <div th:each="question, stat : ${survey.questions}" class="card mb-3 p-3">
                <div class="d-flex align-items-start" style="font-weight: bold; margin-bottom: 10px;">
                    <h5 class="me-2 mb-0" style="white-space: nowrap;" th:text="'Q' + ${stat.count} + '.'">Q1.</h5>
                    <span th:if="${question.required}" class="badge bg-danger me-2"
                        style="white-space: nowrap;">必須</span>
                    <span th:text="${question.text}" style="white-space: pre-wrap;">設問文</span>
                </div>

                <div>
                    <!-- 質問ID (バインド用) -->
                    <input type="hidden" th:field="*{details[__${stat.index}__].questionId}">

                    <th:block th:switch="${question.type.name()}">
                        <!-- TEXT (自由記述) -->
                        <div th:case="'TEXT'">
                            <textarea class="form-control" rows="3"
                                th:field="*{details[__${stat.index}__].responseText}"
                                th:required="${question.required}"></textarea>
                        </div>

                        <!-- RADIO (単一選択) -->
                        <div th:case="'RADIO'" class="ms-3 p-3">
                            <div th:each="item, itemStat : ${question.answerOption.items}" class="form-check">
                                <input class="form-check-input" type="radio"
                                    th:id="${'radio_' + stat.index + '_' + item.itemId}"
                                    th:field="*{details[__${stat.index}__].radioOptionId}" th:value="${item.itemId}"
                                    th:required="${question.required}">
                                <label class="form-check-label" th:for="${'radio_' + stat.index + '_' + item.itemId}"
                                    th:text="${item.itemText}"></label>
                            </div>
                        </div>

                        <!-- CHECKBOX (複数選択) -->
                        <div th:case="'CHECKBOX'" class="ms-3 p-3">
                            <div th:each="item, itemStat : ${question.answerOption.items}" class="form-check">
                                <input class="form-check-input" type="checkbox"
                                    th:id="${'check_' + stat.index + '_' + item.itemId}"
                                    th:field="*{details[__${stat.index}__].checkboxOptionIds}"
                                    th:value="${item.itemId}">
                                <label class="form-check-label" th:for="${'check_' + stat.index + '_' + item.itemId}"
                                    th:text="${item.itemText}"></label>
                            </div>
                        </div>
                    </th:block>
                </div>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-primary btn-lg px-5">回答を送信する</button>
            </div>
        </form>
    </main>
</body>

</html>
