<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xml:lang="ja"
    layout:decorate="~{ ${layout} }">

<head>
    <meta charset="UTF-8">
    <title>アカウント設定</title>
</head>

<body>

    <main layout:fragment="content">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-6 col-md-8">
                    <div class="card shadow-sm mt-4">
                        <div class="card-header bg-white py-3">
                            <h4 class="mb-0">アカウント設定</h4>
                        </div>
                        <div class="card-body p-4">

                            <!-- メッセージ表示 -->
                            <div th:if="${message}" class="alert alert-success alert-dismissible fade show"
                                role="alert">
                                <span th:text="${message}"></span>
                                <button type="button" class="btn-close" data-bs-dismiss="alert"
                                    aria-label="Close"></button>
                            </div>
                            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show"
                                role="alert">
                                <span th:text="${errorMessage}"></span>
                                <button type="button" class="btn-close" data-bs-dismiss="alert"
                                    aria-label="Close"></button>
                            </div>

                            <form th:action="@{/setting/save}" method="post" th:object="${accountForm}">
                                <div class="mb-3">
                                    <label for="username" class="form-label">ユーザーID</label>
                                    <input type="text" class="form-control" th:field="*{username}" readonly
                                        style="background-color: #f8f9fa;">
                                    <div class="form-text">ユーザーIDは変更できません。</div>
                                </div>

                                <div class="mb-3">
                                    <label for="displayName" class="form-label">表示名</label>
                                    <input type="text" class="form-control" th:field="*{displayName}" required>
                                </div>

                                <div class="mb-3">
                                    <label for="email" class="form-label">メールアドレス</label>
                                    <input type="email" class="form-control" th:field="*{email}">
                                </div>

                                <div class="mb-3">
                                    <label for="password" class="form-label">パスワード</label>
                                    <input type="password" class="form-control" th:field="*{password}"
                                        th:errorclass="is-invalid" placeholder="変更する場合のみ入力">
                                    <div class="invalid-feedback" th:errors="*{password}"></div>
                                    <div class="form-text">変更しない場合は空欄のままにしてください。</div>
                                </div>

                                <div class="mb-3">
                                    <label for="passwordConfirmation" class="form-label">パスワード（確認）</label>
                                    <input type="password" class="form-control" th:field="*{passwordConfirmation}"
                                        th:errorclass="is-invalid" placeholder="パスワードを変更する場合は再入力">
                                    <div class="invalid-feedback" th:errors="*{passwordMatching}"></div>
                                </div>

                                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                    <a th:href="@{/}" class="btn btn-outline-secondary me-md-2">キャンセル</a>
                                    <button type="submit" class="btn btn-primary px-4">保存</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
