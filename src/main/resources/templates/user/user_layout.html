<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xml:lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta th:name="_csrf" th:content="${_csrf.token}" />
    <meta th:name="_csrf_header" th:content="${_csrf.headerName}" />

    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">[[${appName}]]</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!--/* Google Fonts: Nunito */-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700&display=swap" rel="stylesheet">
    <script>
        // テーマ初期化
        const getStoredTheme = () => localStorage.getItem('theme');
        const setStoredTheme = theme => localStorage.setItem('theme', theme);
        const getPreferredTheme = () => {
            const storedTheme = getStoredTheme();
            return storedTheme ? storedTheme : 'light';
        }
        document.documentElement.setAttribute('data-bs-theme', getPreferredTheme());
    </script>
    <style>
        a.btn {
            text-decoration: none !important;
        }

        /* ボタンのアニメーションを無効化 */
        .btn {
            transition: none !important;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom shadow-sm">
            <div class="container">
                <a class="navbar-brand fw-bold" th:href="@{/}"
                    style="font-family: 'Nunito', sans-serif; color: #5a5c69;" th:text="${appName}">Mini Enquete</a>

                <!-- 管理者レイアウト用の拡張ポイント(ロゴの右側に配置) -->
                <div class="me-auto ms-3">
                    <th:block layout:fragment="admin-menu"></th:block>
                </div>

                <div class="d-flex align-items-center">
                    <!-- テーマ切り替えボタン -->
                    <button class="btn btn-outline-secondary btn-sm me-3" id="themeToggle" type="button" title="テーマ切替">
                        <i class="bi bi-sun-fill" id="themeIcon"></i>
                    </button>

                    <!-- ヘッダー右側のボタンエリア -->
                    <div layout:fragment="header-buttons" class="d-flex align-items-center gap-2">
                        <div class="dropdown">
                            <button class="btn btn-sm btn-outline-primary dropdown-toggle" type="button"
                                data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="bi bi-person-circle me-1"></i>
                                <span th:text="${account != null ? account.displayName : 'アカウント'}">アカウント</span>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li><a class="dropdown-item" th:href="@{/setting}">アカウント設定</a></li>
                                <li>
                                    <hr class="dropdown-divider">
                                </li>
                                <li>
                                    <form th:action="@{/logout}" method="post" class="d-inline">
                                        <button class="dropdown-item text-danger" type="submit">ログアウト</button>
                                    </form>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-4 flex-grow-1">
        <!-- フラッシュメッセージ (共通) -->
        <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div layout:fragment="content"></div>
    </main>

    <footer class="py-3 mt-auto bg-body-tertiary border-top">
        <div class="container text-center">
            <p class="mb-0 text-muted small">
                &copy; 2025
                <a href="https://github.com/rk-aiz/teamsurvey">github.com/rk-aiz/teamsurvey</a>
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.getElementById('themeToggle');
            const icon = document.getElementById('themeIcon');

            // アイコンの初期表示設定
            if (document.documentElement.getAttribute('data-bs-theme') === 'dark') {
                icon.className = 'bi bi-moon-fill';
            }

            toggleBtn.addEventListener('click', () => {
                const currentTheme = document.documentElement.getAttribute('data-bs-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-bs-theme', newTheme);
                setStoredTheme(newTheme);
                icon.className = newTheme === 'dark' ? 'bi bi-moon-fill' : 'bi bi-sun-fill';
            });
        });
    </script>
</body>

</html>
