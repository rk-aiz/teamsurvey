<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xml:lang="ja"
    layout:decorate="~{ ${layout} }">

<head>
    <meta charset="UTF-8">
    <title>マイページ</title>
</head>

<body>
    <main layout:fragment="content">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm p-4">
                    <h2 class="h4 mb-3">マイページ</h2>

                    <h3 class="h5 text-secondary border-bottom pb-2 mb-3">回答可能なアンケート</h3>

                    <div th:if="${surveys == null or surveys.isEmpty()}" class="alert alert-info" role="alert">
                        現在、回答が必要なアンケートはありません。
                    </div>

                    <div th:if="${surveys != null and !surveys.isEmpty()}" class="list-group">
                        <a th:each="survey : ${surveys}" th:href="@{/response/{id}(id=${survey.id})}"
                            class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                            <div>
                                <h5 class="mb-1" th:text="${survey.title}">アンケートタイトル</h5>
                                <small class="text-muted">締め切り: <span
                                        th:text="${survey.deadline != null ? #temporals.format(survey.deadline, 'yyyy/MM/dd HH:mm') : '無期限'}"></span></small>
                            </div>
                            <span class="badge bg-primary rounded-pill">回答する</span>
                        </a>
                    </div>

                    <h3 class="h5 text-secondary border-bottom pb-2 mb-3 mt-5">公開中のアンケート結果</h3>

                    <div th:if="${surveyAggregations == null or surveyAggregations.isEmpty()}" class="alert alert-info"
                        role="alert">
                        現在、公開されているアンケート結果はありません。
                    </div>

                    <div th:if="${surveyAggregations != null and !surveyAggregations.isEmpty()}" class="list-group">
                        <a th:each="agg : ${surveyAggregations}" th:href="@{/result/{id}(id=${agg.survey.id})}"
                            class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                            <div>
                                <h5 class="mb-1" th:text="${agg.survey.title}">アンケートタイトル</h5>
                                <small class="text-muted">回答数: <span
                                        th:text="${agg.totalResponseCount}">0</span></small>
                            </div>
                            <span class="badge bg-success rounded-pill">結果を見る</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
