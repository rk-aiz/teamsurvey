<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>初期セットアップ</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <script>
        // テーマ初期化 (OSの設定を反映)
        const getPreferredTheme = () => {
            const storedTheme = localStorage.getItem('theme');
            if (storedTheme) return storedTheme;
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-bs-theme', getPreferredTheme());
    </script>
</head>

<body class="bg-body-tertiary">
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">初期セットアップ</h4>
                    </div>
                    <div class="card-body p-4">
                        <p class="text-muted mb-4">
                            ようこそ！<br>
                            まだ管理者が登録されていません。<br>
                            最初の管理者アカウントを作成してください。
                        </p>
                        <form th:action="@{/setup}" method="post" th:object="${accountForm}">
                            <input type="hidden" th:field="*{isNew}" />

                            <div class="mb-3">
                                <label for="username" class="form-label">ユーザー名 (ログインID)</label>
                                <input type="text" class="form-control" th:field="*{username}"
                                    th:errorclass="is-invalid" autofocus>
                                <div class="invalid-feedback" th:errors="*{username}"></div>
                                <div class="form-text">英数字と記号(._-)が使用可能です。</div>
                            </div>

                            <div class="mb-3">
                                <label for="displayName" class="form-label">表示名</label>
                                <input type="text" class="form-control" th:field="*{displayName}"
                                    th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:errors="*{displayName}"></div>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">メールアドレス</label>
                                <input type="email" class="form-control" th:field="*{email}" th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:errors="*{email}"></div>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">パスワード</label>
                                <input type="password" class="form-control" th:field="*{password}"
                                    th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:errors="*{password}"></div>
                            </div>
                            <div class="mb-3">
                                <label for="passwordConfirmation" class="form-label">パスワード(確認)</label>
                                <input type="password" class="form-control" th:field="*{passwordConfirmation}"
                                    th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:errors="*{passwordConfirmation}"></div>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">アカウント作成</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
