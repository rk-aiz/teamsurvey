services:
    app:
        build:
            context: .
            dockerfile: docker/app/Dockerfile
        ports:
            - "9876:13500"
        environment:
            # Spring Bootの設定を環境変数で上書き (PostgreSQLへの接続設定)
            SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/teamsurveydb?stringtype=unspecified
            SPRING_DATASOURCE_USERNAME: teamsurveyuser
            SPRING_DATASOURCE_PASSWORD: teamsurveypass
            SPRING_DATASOURCE_DRIVER-CLASS-NAME: org.postgresql.Driver

            SPRING_SQL_INIT_MODE: never
        depends_on:
            db:
                condition: service_healthy

    db:
        image: postgres:16
        environment:
            POSTGRES_DB: teamsurveydb
            POSTGRES_USER: teamsurveyuser
            POSTGRES_PASSWORD: teamsurveypass
        ports:
            - "5432:5432"
        volumes:
            - db_data:/var/lib/postgresql/data
            - ./docker/db:/docker-entrypoint-initdb.d # 初期化用SQL読み込み設定
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U teamsurveyuser -d teamsurveydb"]
            interval: 2s
            timeout: 10s
            retries: 5

    schemaspy:
        image: schemaspy/schemaspy:latest
        container_name: teamsurvey-schemaspy
        depends_on:
            db:
                condition: service_healthy
        environment:
            - DATABASE_TYPE=pgsql
            - DATABASE_HOST=db
            - DATABASE_PORT=5432
            - DATABASE_NAME=teamsurveydb
            - DATABASE_USER=teamsurveyuser
            - DATABASE_PASSWORD=teamsurveypass
            - DATABASE_SCHEMA=public
            - SCHEMASPY_OUTPUT=/output
            - SCHEMASPY_FONT=IPAGothic # 日本語フォント指定
        volumes:
            - ./docs/schema:/output
        profiles: ["tools"] # 通常起動時には含まれないように設定

volumes:
    db_data:
