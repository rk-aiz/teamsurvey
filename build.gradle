plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.github.rk-aiz'
version = '0.0.1-SNAPSHOT'
description = 'Online Survey System'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
	sourceCompatibility = '21'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
    // SchemaSpy実行用の依存関係設定を定義
    schemaspy
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.1'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	
	// Page, Pagable
	// Source: https://mvnrepository.com/artifact/org.springframework.data/spring-data-commons
    implementation 'org.springframework.data:spring-data-commons:4.0.2'

    // MapStruct
    implementation 'org.mapstruct:mapstruct:1.6.3'

	annotationProcessor 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

	// Thymeleaf Layout
	implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect'
	
	// Spring Security
	implementation 'org.springframework.boot:spring-boot-starter-security'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'

	// Spring Security と Thymeleafの連携用ライブラリ
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

    // Source: https://mvnrepository.com/artifact/org.apache.commons/commons-csv
    implementation 'org.apache.commons:commons-csv:1.14.1'

	testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    
	// MyBatisのテスト用ライブラリ
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:4.0.1' 
    
    // H2データベース(テスト実行時のみ使用)
    testRuntimeOnly 'com.h2database:h2'

    // SchemaSpy本体とドライバ (ドキュメント生成用)
    schemaspy 'org.schemaspy:schemaspy:6.2.4'
    schemaspy 'org.postgresql:postgresql:42.7.3'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.withType(JavaCompile) {
	options.compilerArgs += [
		'-Amapstruct.verbose=true'
	]
}

// SchemaSpyを実行するタスク
tasks.register('generateDbDocs', JavaExec) {
    group = 'documentation'
    description = 'Generates database documentation using SchemaSpy'
    classpath = configurations.schemaspy
    mainClass = 'org.schemaspy.Main'

    // 出力先ディレクトリがない場合は作成
    doFirst {
        file('docs/schema').mkdirs()
    }

    // 環境に応じて接続先を変更できるようにプロパティ化 (デフォルトは開発環境用)
    def dbName = project.findProperty('dbName') ?: 'codeserverdb'
    def dbHost = project.findProperty('dbHost') ?: 'db'
    def dbPort = project.findProperty('dbPort') ?: '5432'
    def dbUser = project.findProperty('dbUser') ?: 'codeservertest'
    def dbPass = project.findProperty('dbPass') ?: 'codeserverpass'
    args = [
        '-t', 'pgsql',
        '-db', dbName,
        '-host', dbHost,
        '-port', dbPort,
        '-u', dbUser,
        '-p', dbPass,
        '-s', 'public',
        '-o', 'docs/schema',
        '-font', 'IPAGothic'        // 日本語フォント指定
    ]
}
