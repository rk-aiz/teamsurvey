name: Deploy DB Schema

on:
  push:
    branches:
      - main
    paths:
      - 'docker/db/**'     # DB定義に変更があった時
      - 'build.gradle'     # タスク定義に変更があった時
      - '.github/workflows/deploy-schema.yml'
  workflow_dispatch:       # 手動実行用

# GitHub Pagesへのデプロイに必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # SchemaSpyのER図生成に必要なGraphvizと日本語フォントをインストール
      - name: Install Graphviz and Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz fonts-ipafont-gothic

      # プロジェクトの docker-compose.yml を利用してDBのみを起動
      # --wait オプションでヘルスチェック(pg_isready)が通るまで待機します
      - name: Start Database
        run: docker compose up -d db --wait

      # Gradleタスクを実行
      # CI環境(localhost)向けに接続情報を上書きします
      # 値は docker-compose.yml の設定値に合わせます
      - name: Generate SchemaSpy Docs
        run: |
          ./gradlew generateDbDocs \
            -PdbHost=localhost \
            -PdbName=teamsurveydb \
            -PdbUser=teamsurveyuser \
            -PdbPass=teamsurveypass

      - name: Create .nojekyll file
        run: touch docs/schema/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/schema'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
